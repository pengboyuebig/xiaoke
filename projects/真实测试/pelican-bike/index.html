<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑车</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: radial-gradient(circle at 50% 0%, #eaf6fd 0%, #d7ebf7 45%, #c3dceb 100%);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  .card { width: min(760px, 100%); margin: 0; }
  svg   { width: 100%; height: auto; display: block; }
  .caption {
    margin-top: 12px;
    text-align: center;
    color: #5b7183;
    font-size: 13px;
    letter-spacing: 0.6px;
  }

  /* ---------- 车轮自转 ---------- */
  .spin { transform-box: view-box; animation: spin 1.6s linear infinite; }
  #spokes-rear  { transform-origin: 150px 270px; }
  #spokes-front { transform-origin: 480px 270px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- 身体起伏 ---------- */
  .pelican { animation: bob 0.9s ease-in-out infinite alternate; }
  @keyframes bob {
    from { transform: translateY(0); }
    to   { transform: translateY(-5px); }
  }

  /* ---------- 围巾飘动 ---------- */
  .scarf-tail {
    transform-box: view-box;
    transform-origin: 316px 90px;
    animation: flutter 0.7s ease-in-out infinite alternate;
  }
  @keyframes flutter { to { transform: rotate(-9deg); } }

  /* ---------- 地面滚动 ---------- */
  .road {
    stroke-dasharray: 14 16;
    animation: flow 0.7s linear infinite;
  }
  @keyframes flow { to { stroke-dashoffset: 30; } }

  /* ---------- 速度线 ---------- */
  .speed { transform-box: view-box; animation: whoosh 1.1s linear infinite; }
  .speed.s2 { animation-delay: -0.35s; }
  .speed.s3 { animation-delay: -0.7s; }
  @keyframes whoosh {
    0%   { transform: translateX(26px);  opacity: 0; }
    40%  {                               opacity: 0.55; }
    100% { transform: translateX(-34px); opacity: 0; }
  }

  /* ---------- 云飘 ---------- */
  .clouds { transform-box: view-box; animation: drift 16s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translateX(14px); } }

  /* 尊重系统「减少动态效果」设置 */
  @media (prefers-reduced-motion: reduce) {
    .spin, .pelican, .scarf-tail, .road, .speed, .clouds { animation: none !important; }
  }
</style>
</head>
<body>

<figure class="card">
  <svg viewBox="0 0 640 400" role="img" aria-label="一只鹈鹕骑着自行车向右前行">
    <title>鹈鹕骑车</title>

    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#e8f5fc"/>
        <stop offset="100%" stop-color="#cfe6f4"/>
      </linearGradient>
    </defs>

    <!-- 天空 -->
    <rect width="640" height="400" fill="url(#sky)"/>

    <!-- 云 -->
    <g class="clouds" fill="#ffffff" opacity="0.72">
      <ellipse cx="96"  cy="66"  rx="44" ry="18"/>
      <ellipse cx="124" cy="55"  rx="30" ry="16"/>
      <ellipse cx="582" cy="118" rx="34" ry="14"/>
      <ellipse cx="602" cy="110" rx="22" ry="12"/>
    </g>

    <!-- 地面阴影 -->
    <ellipse cx="315" cy="338" rx="205" ry="11" fill="#a8c6d8" opacity="0.42"/>

    <!-- 地面 -->
    <line class="road" x1="30" y1="332" x2="610" y2="332"
          stroke="#8fb4c8" stroke-width="4" stroke-linecap="round"/>

    <!-- 速度线 -->
    <g stroke="#9fc0d2" stroke-width="4" stroke-linecap="round">
      <line class="speed"    x1="20" y1="110" x2="96"  y2="110"/>
      <line class="speed s2" x1="42" y1="150" x2="104" y2="150"/>
      <line class="speed s3" x1="8"  y1="190" x2="72"  y2="190"/>
    </g>

    <!-- ================= 后轮 ================= -->
    <g>
      <circle cx="150" cy="270" r="62" fill="none" stroke="#2b3440" stroke-width="10"/>
      <circle cx="150" cy="270" r="53" fill="none" stroke="#94a4b2" stroke-width="4"/>
      <g id="spokes-rear" class="spin" stroke="#b6c3ce" stroke-width="2.5">
        <line x1="97"    y1="270"   x2="203"   y2="270"/>
        <line x1="150"   y1="217"   x2="150"   y2="323"/>
        <line x1="112.5" y1="232.5" x2="187.5" y2="307.5"/>
        <line x1="187.5" y1="232.5" x2="112.5" y2="307.5"/>
      </g>
      <circle cx="150" cy="270" r="7" fill="#5a6b78"/>
    </g>

    <!-- ================= 前轮 ================= -->
    <g>
      <circle cx="480" cy="270" r="62" fill="none" stroke="#2b3440" stroke-width="10"/>
      <circle cx="480" cy="270" r="53" fill="none" stroke="#94a4b2" stroke-width="4"/>
      <g id="spokes-front" class="spin" stroke="#b6c3ce" stroke-width="2.5">
        <line x1="427"   y1="270"   x2="533"   y2="270"/>
        <line x1="480"   y1="217"   x2="480"   y2="323"/>
        <line x1="442.5" y1="232.5" x2="517.5" y2="307.5"/>
        <line x1="517.5" y1="232.5" x2="442.5" y2="307.5"/>
      </g>
      <circle cx="480" cy="270" r="7" fill="#5a6b78"/>
    </g>

    <!-- ================= 传动 ================= -->
    <circle cx="300" cy="285" r="16" fill="none" stroke="#6b7a86" stroke-width="5"/>
    <circle cx="150" cy="270" r="9"  fill="none" stroke="#6b7a86" stroke-width="4"/>
    <path d="M150,261 L300,269 M150,279 L300,301"
          fill="none" stroke="#8a99a6" stroke-width="3" stroke-dasharray="6 4"/>

    <!-- ================= 车架 ================= -->
    <g stroke="#2a7f8f" stroke-width="7" stroke-linecap="round" fill="none">
      <line x1="150" y1="270" x2="300" y2="285"/> <!-- 后下叉 -->
      <line x1="150" y1="270" x2="262" y2="180"/> <!-- 后上叉 -->
      <line x1="300" y1="285" x2="262" y2="180"/> <!-- 立管 -->
      <line x1="262" y1="180" x2="448" y2="178"/> <!-- 上管 -->
      <line x1="300" y1="285" x2="462" y2="212"/> <!-- 下管 -->
      <line x1="448" y1="178" x2="462" y2="212"/> <!-- 头管 -->
      <line x1="462" y1="212" x2="480" y2="270"/> <!-- 前叉 -->
      <line x1="448" y1="178" x2="440" y2="156"/> <!-- 把立 -->
    </g>

    <!-- 车把 -->
    <path d="M440,156 C452,148 470,148 476,158 C480,164 476,170 470,168"
          fill="none" stroke="#1f5f6b" stroke-width="8" stroke-linecap="round"/>

    <!-- 车座 -->
    <path d="M228,174 C244,164 268,164 278,172 C280,180 268,186 250,184 C236,184 226,180 228,174 Z"
          fill="#33424e"/>

    <!-- 曲柄与踏板 -->
    <g stroke="#55636f" stroke-width="6" stroke-linecap="round">
      <line x1="300" y1="285" x2="322" y2="292"/>
      <line x1="300" y1="285" x2="278" y2="278"/>
    </g>
    <rect x="310" y="288" width="26" height="7" rx="3" fill="#3d4a54"/>
    <rect x="266" y="274" width="26" height="7" rx="3" fill="#3d4a54"/>

    <!-- ================= 鹈鹕 ================= -->
    <g class="pelican">

      <!-- 远侧腿 -->
      <path d="M256,168 L276,222 L282,272"
            fill="none" stroke="#c87a24" stroke-width="9" stroke-linecap="round"/>
      <ellipse cx="284" cy="272" rx="11" ry="5" fill="#c87a24"/>

      <!-- 身体 -->
      <ellipse cx="255" cy="132" rx="66" ry="40" transform="rotate(-8 255 132)"
               fill="#fdfdfb" stroke="#e2e2d8" stroke-width="2"/>
      <!-- 尾羽 -->
      <path d="M198,148 C182,152 172,148 168,142 C178,138 190,136 200,138 Z" fill="#ecece2"/>

      <!-- 脖子 -->
      <path d="M292,110 C300,72 332,60 356,64"
            fill="none" stroke="#fdfdfb" stroke-width="34" stroke-linecap="round"/>

      <!-- 头 -->
      <circle cx="372" cy="72" r="24" fill="#fdfdfb" stroke="#e2e2d8" stroke-width="2"/>

      <!-- 上喙 -->
      <path d="M386,60 C424,64 476,76 526,86 C476,90 424,84 388,78 Z"
            fill="#f2a63b" stroke="#d98d24" stroke-width="2"/>
      <!-- 喉囊 -->
      <path d="M390,78 C394,118 438,140 474,128 C500,120 518,100 524,88 C500,84 440,80 390,78 Z"
            fill="#f7c877" stroke="#dda746" stroke-width="2"/>
      <!-- 喙尖小钩 -->
      <path d="M524,86 C529,87 530,91 526,93" fill="none" stroke="#d98d24" stroke-width="2.5" stroke-linecap="round"/>

      <!-- 眼睛 -->
      <circle cx="378" cy="64" r="6" fill="#2b3440"/>
      <circle cx="380" cy="62" r="2" fill="#ffffff"/>

      <!-- 头顶小撮毛 -->
      <g stroke="#dcdcd0" stroke-width="3" stroke-linecap="round" fill="none">
        <path d="M356,50 C352,40 346,34 340,30"/>
        <path d="M364,47 C362,36 358,28 354,22"/>
      </g>

      <!-- 围巾 -->
      <path d="M310,84 C318,76 336,76 344,84 C336,94 318,94 310,90 Z" fill="#d9534f"/>
      <path class="scarf-tail" d="M316,90 C300,98 284,92 268,100"
            fill="none" stroke="#d9534f" stroke-width="9" stroke-linecap="round"/>

      <!-- 翅膀（伸向车把） -->
      <path d="M292,108 C336,96 396,116 462,148 C472,152 476,162 468,166
               C458,171 436,158 396,152 C352,145 312,148 288,142 Z"
            fill="#fdfdfb" stroke="#e2e2d8" stroke-width="2"/>
      <g stroke="#e8e8de" stroke-width="2.5" fill="none" stroke-linecap="round">
        <path d="M320,124 C348,130 380,140 404,148"/>
        <path d="M330,136 C356,140 384,146 404,150"/>
      </g>

      <!-- 近侧腿 -->
      <path d="M272,166 L296,216 L318,286"
            fill="none" stroke="#e08a2e" stroke-width="10" stroke-linecap="round"/>
      <ellipse cx="322" cy="288" rx="12" ry="5.5" fill="#e08a2e"/>

    </g>
  </svg>

  <figcaption class="caption">鹈鹕骑车 · 纯 SVG 手绘</figcaption>
</figure>

</body>
</html>
